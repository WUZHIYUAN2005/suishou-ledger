      (() => {
        let mode;
        try {
          mode = localStorage.getItem("suishou-ledger.theme.v1");

          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";

            "#171725";

<style id="suishou-recovery-menu-style">
.ledger-recovery-dialog{
  width:min(96vw,720px);height:min(94dvh,950px);max-width:none;max-height:none;
  padding:0;border:1px solid var(--rim,#ffffffc8);border-radius:25px;
  color:var(--ink,#29243c);background:var(--panel,#fefcffec);
  box-shadow:0 24px 65px #211c4a48;overflow:hidden;
}
.ledger-recovery-dialog::backdrop{background:#111327a9;backdrop-filter:blur(6px)}
.ledger-recovery-shell{height:100%;display:flex;flex-direction:column}
.ledger-recovery-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--inner-rim,#e8e2f6);background:var(--surface,#f9f8fce8)}
.ledger-recovery-toolbar strong{font-size:15px;line-height:1.4}
.ledger-recovery-close{border:1px solid var(--rim,#fff);border-radius:12px;background:var(--glass,#fff8);
  color:inherit;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.ledger-recovery-dialog iframe{display:block;width:100%;height:100%;min-height:0;flex:1;border:none;background:#f6f2fb}
</style>
<script id="suishou-recovery-menu-script">
(() => {
  "use strict";
  if (window.__suishouRecoveryMenuInstalled) return;
  window.__suishouRecoveryMenuInstalled = true;
  function openRecovery() {
    if (document.getElementById("ledger-recovery-dialog")) return;
    const dialog = document.createElement("dialog");
    dialog.id = "ledger-recovery-dialog";
    dialog.className = "ledger-recovery-dialog";
    dialog.setAttribute("aria-label", "安全恢复订阅与卡包");
    const shell = document.createElement("div");
    shell.className = "ledger-recovery-shell";
    const toolbar = document.createElement("div");
    toolbar.className = "ledger-recovery-toolbar";
    const title = document.createElement("strong");
    title.textContent = "安全恢复 · 合并订阅与卡包";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "ledger-recovery-close";
    close.textContent = "返回账本";
    close.addEventListener("click", () => dialog.close());
    toolbar.append(title, close);
    const frame = document.createElement("iframe");
    frame.title = "随手账本安全恢复";
    frame.src = "./restore-data.html?embedded=1";
    shell.append(toolbar, frame);
    dialog.append(shell);
    dialog.addEventListener("cancel", event => {
      event.preventDefault();
      dialog.close();
    });
    dialog.addEventListener("close", () => {
      dialog.remove();
      // The recovery frame writes to the same origin. Reload to make React
      // re-read the just-restored data even if Safari omits a storage event.
      location.reload();
    }, { once: true });
    document.body.append(dialog);
    dialog.showModal();
    close.focus({ preventScroll: true });
  }
  function install() {
    const menu = document.querySelector("nav.menu-list");
    if (!menu || menu.querySelector("[data-recovery-menu]")) return;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "glass-button";
    button.setAttribute("data-recovery-menu", "true");
    const face = document.createElement("span");
    face.className = "glass-face";
    const label = document.createElement("span");
    label.textContent = "安全恢复订阅与卡包";
    const arrow = document.createElement("span");
    arrow.textContent = "›";
    arrow.setAttribute("aria-hidden", "true");
    arrow.style.fontSize = "20px";
    face.append(label, arrow);
    button.append(face);
    button.addEventListener("click", openRecovery);
    menu.append(button);
  }
  const root = document.getElementById("root");
  if (!root) return;
  const observer = new MutationObserver(install);
  observer.observe(root, { childList: true, subtree: true });
  install();
})();
</script>
