<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5eff8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="随手账本" />
    <meta
      name="description"
      content="私人记账，支持 Google Drive 云端同步与本地备份。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>随手账本</title>
    <script>
      (() => {
        let mode;
        try {
          mode = localStorage.getItem("suishou-ledger.theme.v1");
        } catch (_) {}
        const dark =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark)
          document.querySelector('meta[name="theme-color"]').content =
            "#171725";
      })();
    </script>
    <!-- INLINE_STYLES -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>请启用 JavaScript 后打开随手账本。</noscript>
    <!-- INLINE_SCRIPT -->
  </body>
</html>
